<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2ef" />
    <script>
      // Picks the theme before the first paint, so a dark phone never sees a white flash.
      (function () {
        try {
          var choice = localStorage.getItem("collabitat.theme");
          var isDark = choice === "dark" || (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="description" content="Split costs, rotate chores and plan meals with the people you live with." />
    <title>Collabitat</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Collabitat" />
    <meta property="og:title" content="Collabitat" />
    <meta property="og:description" content="Split costs, rotate chores and plan meals with the people you live with." />
    <meta property="og:url" content="https://fly-die.github.io/collabitat-web/" />
    <meta property="og:image" content="https://fly-die.github.io/collabitat-web/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Collabitat: costs, chores and meals for your flat" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
