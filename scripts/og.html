<!doctype html>
<!--
  Source for public/og.png (1200x630). Render with headless Chrome after npm install:
  chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
    --window-size=1200,630 --screenshot=public/og.png scripts/og.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Collabitat link preview image</title>
    <style>
      @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400;
        src: url("../node_modules/@fontsource/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700;
        src: url("../node_modules/@fontsource/atkinson-hyperlegible/files/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #070707; color: #ededea;
        font: 400 26px/1.35 "Atkinson Hyperlegible", sans-serif;
        position: relative;
      }
      .glow { position: absolute; inset: 0;
        background: radial-gradient(60% 75% at 72% 30%, rgb(30 77 59 / 85%), transparent 70%),
                    radial-gradient(40% 50% at 20% 10%, rgb(125 191 164 / 18%), transparent 70%); }
      .house { position: absolute; left: 72px; top: 72px; display: flex; }
      .av { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center;
        font-size: 40px; font-weight: 700; box-shadow: 0 0 0 8px #0b1410; margin-right: -18px; }
      
      h1 { position: absolute; left: 72px; bottom: 64px; font-weight: 400; font-size: 120px; letter-spacing: -3px; line-height: 1; }
      .sub { position: absolute; right: 72px; bottom: 82px; text-align: right; font-size: 28px; color: #c9cbc6; }
      .sub b { display: block; color: #7dbfa4; font-weight: 400; margin-top: 6px; font-size: 24px; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="house">
      <span class="av" style="background:#7dbfa4;color:#111214">F</span>
      <span class="av" style="background:#c79bd0;color:#111214">M</span>
      <span class="av" style="background:#8fb8e6;color:#111214">J</span>
      <span class="av" style="background:#e0b04a;color:#111214">L</span>
      <span class="av" style="background:#8fc7c0;color:#111214">S</span>
    </div>
    <h1>Collabitat</h1>
    <p class="sub">Costs, chores and meals for your flat<b>flynndiener.ch</b></p>
  </body>
</html>
